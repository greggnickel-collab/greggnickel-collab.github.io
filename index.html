<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Projects, current work, and background.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved/system theme before the page paints to avoid a color flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <!-- All page content lives in content.js — edit that file, not this one. -->
  <script src="content.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="#top" class="brand" id="brand"></a>
      <nav class="nav" aria-label="Sections">
        <a href="#current">Current</a>
        <a href="#projects">Projects</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap hero-inner">
        <div class="hero-text">
          <p class="eyebrow" id="heroTitle"></p>
          <h1 id="heroName"></h1>
          <p class="lede" id="heroSummary"></p>
          <div class="hero-links" id="heroLinks"></div>
        </div>
        <div class="hero-photo" id="heroPhoto"></div>
      </div>
    </section>

    <section id="current" class="section">
      <div class="wrap">
        <h2 class="section-title">Currently working on</h2>
        <div class="grid" id="currentList"></div>
      </div>
    </section>

    <section id="projects" class="section section-alt">
      <div class="wrap">
        <h2 class="section-title">Past projects</h2>
        <div class="filters" id="filters" role="group" aria-label="Filter by skill"></div>
        <div class="grid" id="pastList"></div>
      </div>
    </section>

    <section id="about" class="section">
      <div class="wrap">
        <h2 class="section-title">About</h2>
        <div class="about-grid">
          <div>
            <div class="bio" id="bio"></div>
            <div class="skills" id="skills"></div>
          </div>
          <div class="about-side">
            <h3>Education</h3>
            <ul class="timeline" id="education"></ul>
            <h3>Certifications</h3>
            <ul class="certs" id="certs"></ul>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="section section-alt">
      <div class="wrap contact">
        <h2 class="section-title">Get in touch</h2>
        <p class="contact-blurb" id="contactBlurb"></p>
        <div class="contact-list" id="contactList"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap" id="footer"></div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
